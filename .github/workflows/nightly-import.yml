name: Nightly import

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  import:
    name: Import latest articles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger production import
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SITE_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent \
            --request POST \
            --header "x-cron-secret: ${CRON_SECRET}" \
            "${SITE_URL%/}/api/import"

